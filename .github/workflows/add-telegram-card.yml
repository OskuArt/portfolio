name: Add Telegram card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-telegram-card.yml"

permissions:
  contents: write

jobs:
  add-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Telegram card to hero
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if 'telegram-card-stage' in html:
              print('Telegram card is already present.')
              raise SystemExit(0)

          css = r'''
          /* Telegram contact card */
          .telegram-card-stage{
            position:relative;
            margin:34px 0 6px;
            padding:34px 8px 18px 92px;
            isolation:isolate;
          }
          .telegram-card-link{
            position:relative;
            z-index:2;
            display:block;
            width:min(100%,560px);
            margin-left:auto;
            transform:rotate(-3deg);
            transform-origin:center;
            transition:transform .38s cubic-bezier(.2,.8,.2,1),filter .38s;
            will-change:transform;
          }
          .telegram-card-link img{
            width:100%;
            height:auto;
            border-radius:28px;
            filter:drop-shadow(0 24px 24px rgba(17,18,15,.18)) drop-shadow(0 6px 7px rgba(17,18,15,.10));
            transition:filter .38s cubic-bezier(.2,.8,.2,1);
          }
          .telegram-card-link:after{
            content:"";
            position:absolute;
            inset:2.5% 2.5% 4%;
            border-radius:24px;
            background:linear-gradient(115deg,rgba(255,255,255,.30),transparent 24%,transparent 72%,rgba(255,255,255,.13));
            opacity:.52;
            pointer-events:none;
            mix-blend-mode:screen;
          }
          .telegram-card-link:hover{
            transform:translateY(-8px) rotate(-1.2deg) scale(1.045);
          }
          .telegram-card-link:hover img{
            filter:drop-shadow(0 34px 34px rgba(17,18,15,.22)) drop-shadow(0 10px 10px rgba(17,18,15,.11));
          }
          .telegram-card-callout{
            position:absolute;
            z-index:4;
            left:0;
            top:6px;
            pointer-events:none;
            font:500 clamp(30px,3.05vw,45px)/.86 "Space Grotesk",sans-serif;
            letter-spacing:-.06em;
            transform:rotate(-5deg);
            color:var(--ink);
          }
          .telegram-card-callout strong{
            color:var(--accent);
            font-weight:500;
          }
          .telegram-card-arrow{
            position:absolute;
            left:26px;
            top:82px;
            width:142px;
            height:116px;
            overflow:visible;
          }
          .telegram-card-arrow path{
            fill:none;
            stroke:var(--accent);
            stroke-width:3.2;
            stroke-linecap:round;
            stroke-linejoin:round;
          }
          @media(max-width:900px){
            .telegram-card-stage{max-width:690px;margin:28px auto 0;padding-left:96px}
          }
          @media(max-width:620px){
            .telegram-card-stage{margin-top:24px;padding:76px 0 12px}
            .telegram-card-callout{left:8px;top:2px;font-size:29px;transform:rotate(-3deg)}
            .telegram-card-arrow{left:102px;top:29px;width:96px;height:74px}
            .telegram-card-link{width:94%;margin-inline:auto;transform:rotate(-2deg)}
            .telegram-card-link:hover{transform:translateY(-5px) rotate(-.7deg) scale(1.025)}
          }
          @media(prefers-reduced-motion:reduce){
            .telegram-card-link,.telegram-card-link img{transition:none}
          }
          '''

          card = r'''
              <div class="telegram-card-stage">
                <div class="telegram-card-callout">Click to<br><strong>text me!</strong>
                  <svg class="telegram-card-arrow" viewBox="0 0 142 116" aria-hidden="true">
                    <path d="M8 10 C30 28 30 72 116 84"/>
                    <path d="M98 66 L118 84 L96 99"/>
                  </svg>
                </div>
                <a class="telegram-card-link" href="https://t.me/oskuarttt" target="_blank" rel="noreferrer" aria-label="Message me on Telegram">
                  <img src="assets/contact-card.webp" alt="Kseniia Smirnova / Osku Halla graphic designer card">
                </a>
              </div>
          '''

          css_anchor = '\n.ticker{'
          if css_anchor not in html:
              raise RuntimeError('CSS insertion anchor not found')
          html = html.replace(css_anchor, '\n' + css + css_anchor, 1)

          hero_anchor = '      <p class="hero-copy">I turn ideas into visual systems people can recognize, remember and use. Branding, packaging, e-commerce, illustration and digital design, from the first sketch to production-ready files.</p>\n'
          if hero_anchor not in html:
              raise RuntimeError('Hero insertion anchor not found')
          html = html.replace(hero_anchor, hero_anchor + card, 1)

          path.write_text(html, encoding='utf-8')
          print('Telegram contact card added to hero.')
          PY

      - name: Commit layout update
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No HTML changes."
            exit 0
          fi
          git commit -m "Add interactive Telegram contact card"
          git push
