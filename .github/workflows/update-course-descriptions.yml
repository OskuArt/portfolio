name: Update course descriptions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-course-descriptions.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update descriptions
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old1 = '<p>Marketplace Infographics</p>'
          new1 = '<p>Marketplace performance design: category and competitor research, buyer-journey logic, information hierarchy for product cards, A/B hypotheses and visual decisions aimed at improving CTR, CVR and add-to-cart performance.</p>'

          old2 = '<p>NeuroGuide 2.0</p>'
          new2 = '<p>Advanced AI-assisted e-commerce production: prompt engineering, product visualization, image and video generation, rapid creative variations, audience-focused concepts and testing ideas against engagement and conversion metrics.</p>'

          if old1 not in s:
              raise SystemExit("Creativo description not found")
          if old2 not in s:
              raise SystemExit("NeuroGuide description not found")

          s = s.replace(old1, new1, 1)
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          rm .github/workflows/update-course-descriptions.yml
          git add index.html .github/workflows/update-course-descriptions.yml
          git commit -m "Improve education course descriptions"
          git push
