name: Add education courses v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Patch education
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); needle='    <div class=\"edu\">\\n      <div><h3>Graphic Design</h3><small>College · 2022–2024</small></div>\\n      <p>Focused on print production, prepress, layout, branding and digital design, while continuing to develop illustration as a parallel professional skill.</p>\\n    </div>'; add='\\n    <div class=\"edu\">\\n      <div><h3>Creativo</h3><small>Course · Apr 2026</small></div>\\n      <p>Marketplace Infographics</p>\\n    </div>\\n    <div class=\"edu\">\\n      <div><h3>NeuroGuide</h3><small>Course · Apr 2026</small></div>\\n      <p>NeuroGuide 2.0</p>\\n    </div>'; assert needle in s, 'Education block not found'; p.write_text(s.replace(needle, needle+add, 1), encoding='utf-8')"
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add design courses to education"
          git push
