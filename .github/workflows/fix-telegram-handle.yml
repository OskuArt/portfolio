name: Fix Telegram handle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-telegram-handle.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace Telegram handle
        run: |
          sed -i 's/osluarttt/oskuarttt/g' index.html

      - name: Commit fix
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Telegram handle is already correct."
            exit 0
          fi
          git commit -m "Fix Telegram handle"
          git push
