name: Reduce Case Place logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reduce-caseplace-logo.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reduce logo size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.pc--caseplace .pc__logo{right:5.5%!important;top:50%!important;width:min(40%,310px)!important;transform:translateY(-50%) scale(1)!important;transform-origin:center!important;transition:transform .38s cubic-bezier(.2,.8,.2,1)!important;will-change:transform}'
          new = '.pc--caseplace .pc__logo{right:6.5%!important;top:50%!important;width:min(31%,250px)!important;transform:translateY(-50%) scale(1)!important;transform-origin:center!important;transition:transform .38s cubic-bezier(.2,.8,.2,1)!important;will-change:transform}'
          if old not in s:
              raise SystemExit('Expected Case Place logo rule not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce Case Place logo size"
          git push
