name: Clean education duplicates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dedupe-education.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Remove duplicate course cards
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); pair='    <div class=\"edu\">\\n      <div><h3>Creativo</h3><small>Course · Apr 2026</small></div>\\n      <p>Marketplace Infographics</p>\\n    </div>\\n    <div class=\"edu\">\\n      <div><h3>NeuroGuide</h3><small>Course · Apr 2026</small></div>\\n      <p>NeuroGuide 2.0</p>\\n    </div>'; double=pair+'\\n'+pair; assert double in s, 'Duplicate course block not found'; p.write_text(s.replace(double, pair, 1), encoding='utf-8')"
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          rm .github/workflows/dedupe-education.yml
          git add index.html .github/workflows/dedupe-education.yml
          git commit -m "Clean education course cards"
          git push
