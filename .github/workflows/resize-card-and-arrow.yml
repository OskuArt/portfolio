name: Resize contact card and arrow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resize-card-and-arrow.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply card layout patch
        run: python scripts/patch_card_size_arrow.py
      - name: Commit changes
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          rm .github/workflows/resize-card-and-arrow.yml
          rm scripts/patch_card_size_arrow.py
          git add index.html .github/workflows/resize-card-and-arrow.yml scripts/patch_card_size_arrow.py
          git commit -m "Refine contact card size and arrow spacing"
          git push
