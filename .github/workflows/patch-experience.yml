name: Patch experience order

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-experience.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch experience section
        shell: python
        run: |
          from pathlib import Path
          import re, base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new_section = base64.b64decode('').decode('utf-8')
          s, n = re.subn(r'  <section id="experience" class="reveal">[\s\S]*?(?=  <section id="skills" class="reveal">)', new_section, s, count=1)
          if n != 1:
              raise SystemExit('Could not replace experience section')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'chatgpt[bot]'
          git config user.email 'chatgpt[bot]@users.noreply.github.com'
          rm .github/workflows/patch-experience.yml
          git add index.html .github/workflows/patch-experience.yml
          git commit -m 'Reorder experience and update Laika level'
          git push
