name: Add education courses

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-education-courses.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add courses under college
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old = '''    <div class="edu">
      <div><h3>Graphic Design</h3><small>College · 2022–2024</small></div>
      <p>Focused on print production, prepress, layout, branding and digital design, while continuing to develop illustration as a parallel professional skill.</p>
    </div>'''

          new = '''    <div class="edu">
      <div><h3>Graphic Design</h3><small>College · 2022–2024</small></div>
      <p>Focused on print production, prepress, layout, branding and digital design, while continuing to develop illustration as a parallel professional skill.</p>
    </div>
    <div class="edu">
      <div><h3>Creativo</h3><small>Course · Apr 2026</small></div>
      <p>Marketplace Infographics</p>
    </div>
    <div class="edu">
      <div><h3>NeuroGuide</h3><small>Course · Apr 2026</small></div>
      <p>NeuroGuide 2.0</p>
    </div>'''

          if old not in s:
              raise SystemExit("Education block not found; index.html was not changed")

          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          rm .github/workflows/add-education-courses.yml
          git add index.html .github/workflows/add-education-courses.yml
          git commit -m "Add design courses to education"
          git push
