name: Sync Behance portfolio

on:
  schedule:
    # 00:07 Moscow time. A few minutes after the hour reduces GitHub's
    # scheduled-job congestion compared with exactly 00:00.
    - cron: "7 0 * * *"
      timezone: "Europe/Moscow"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: behance-portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Sync public Behance projects
        run: python scripts/update_behance.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "behance-sync[bot]"
          git config user.email "behance-sync[bot]@users.noreply.github.com"

          git add projects.json assets/project-previews .behance-sync-state.json

          if git diff --cached --quiet; then
            echo "No portfolio changes."
            exit 0
          fi

          git commit -m "Auto-sync Behance portfolio"
          git push
