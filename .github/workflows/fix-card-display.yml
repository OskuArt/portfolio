name: Fix card display
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-card-display.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch card image and arrow
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://raw.githubusercontent.com/OskuArt/portfolio/main/assets/contact-card.webp?v=20260901'
          if old not in s and 'assets/contact-card.webp' not in s:
              raise SystemExit('Could not find Telegram card image src')
          s = s.replace(old, 'assets/contact-card.webp?v=20260901-2')
          css = '''\n/* final Telegram card display fix */\n.telegram-card-arrow{left:calc(100% + 10px)!important;top:64%!important;width:150px!important;height:auto!important}\n@media(max-width:900px){.telegram-card-arrow{left:calc(100% + 8px)!important;top:62%!important;width:118px!important}}\n@media(max-width:620px){.telegram-card-arrow{left:calc(100% + 4px)!important;top:58%!important;width:92px!important}}\n'''
          if '/* final Telegram card display fix */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'chatgpt[bot]'
          git config user.email 'chatgpt[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Telegram card image source and arrow position'
          git push
