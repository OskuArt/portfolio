name: Fix Behance metadata v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-behance-meta-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          projects_path = Path('projects.json')
          projects = json.loads(projects_path.read_text(encoding='utf-8'))

          for project in projects:
              title = str(project.get('title', '')).strip()
              project['title'] = re.sub(r'\s*[-–—|]\s*Osku\s+Halla\s*$', '', title, flags=re.I).strip()
              if str(project.get('id')) == '255090661':
                  project['category'] = 'ecommerce'
                  project['meta'] = 'E-commerce · Meta creatives'

          projects_path.write_text(json.dumps(projects, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          ecommerce_button = '<button class="filter" data-filter="ecommerce">E-commerce</button>'
          if ecommerce_button not in html:
              marker = '<button class="filter" data-filter="packaging">Packaging</button>'
              if marker not in html:
                  raise SystemExit('Packaging filter not found')
              html = html.replace(marker, marker + '\n      ' + ecommerce_button, 1)
          index_path.write_text(html, encoding='utf-8')

          sync_path = Path('scripts/update_behance.py')
          sync = sync_path.read_text(encoding='utf-8')

          meta_line = '    "packaging": "Packaging · Behance project",'
          ecommerce_meta = '    "ecommerce": "E-commerce · Behance project",'
          if ecommerce_meta not in sync:
              if meta_line not in sync:
                  raise SystemExit('CATEGORY_META marker not found')
              sync = sync.replace(meta_line, meta_line + '\n' + ecommerce_meta, 1)

          cleanup_line = '    title = re.sub(r"\\s+on Behance\\s*$", "", title, flags=re.I)'
          suffix_cleanup = '    title = re.sub(r"\\s*[-–—|]\\s*Osku\\s+Halla\\s*$", "", title, flags=re.I)'
          if suffix_cleanup not in sync:
              if cleanup_line not in sync:
                  raise SystemExit('Title cleanup marker not found')
              sync = sync.replace(cleanup_line, cleanup_line + '\n' + suffix_cleanup, 1)

          ecommerce_group = '''        ("ecommerce", (
            "e-commerce", "ecommerce", "e commerce", "meta ads", "meta advertising",
            "creative banners", "banners for meta", "ad creative", "ad creatives",
            "advertising creative", "advertising creatives", "performance marketing",
            "marketplace", "product card", "amazon listing", "wildberries", "ozon",
            "wb card", "e-com", "shopping ads",
        )),
'''
          groups_marker = '    groups = [\n'
          if '("ecommerce", (' not in sync:
              if groups_marker not in sync:
                  raise SystemExit('Category groups marker not found')
              sync = sync.replace(groups_marker, groups_marker + ecommerce_group, 1)

          sync_path.write_text(sync, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'chatgpt[bot]'
          git config user.email 'chatgpt[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-behance-meta.yml .github/workflows/fix-behance-meta-v2.yml
          git add projects.json index.html scripts/update_behance.py .github/workflows/fix-behance-meta.yml .github/workflows/fix-behance-meta-v2.yml
          git commit -m 'Fix Behance titles and add e-commerce category'
          git push
