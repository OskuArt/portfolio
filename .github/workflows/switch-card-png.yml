name: Switch contact card to PNG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/switch-card-png.yml"

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update image source only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          candidates = [
              'assets/contact-card.webp?v=20260901-2',
              'assets/contact-card.webp?v=20260901',
              'assets/contact-card.webp',
              'https://raw.githubusercontent.com/OskuArt/portfolio/main/assets/contact-card.webp?v=20260901',
          ]
          replaced = False
          for old in candidates:
              if old in s:
                  s = s.replace(old, 'assets/contact-card.png?v=20260902', 1)
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('Could not find current contact card src')
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'chatgpt[bot]'
          git config user.email 'chatgpt[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Switch Telegram contact card to PNG'
          git push
