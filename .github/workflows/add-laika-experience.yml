name: Add Laika experience

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-laika-experience.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Laika role to Experience
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '''    <div class="row">\n      <div><div class="role">Graphic Designer</div><div class="company">Freelance</div><div class="date">March 2023 — Present</div></div>'''

          laika = '''    <div class="row">\n      <div><div class="role">Graphic Designer</div><div class="company">Laika Design Studio</div><div class="date">2021 — 2022</div></div>\n      <div class="company">Design studio · Exhibition, print & event design</div>\n      <ul>\n        <li>Designed exhibition stands for cultural and public projects</li>\n        <li>Created visual materials for the Night of Museums events in Saint Petersburg and the Leningrad Region</li>\n        <li>Prepared magazine layouts and print-ready files</li>\n        <li>Developed exhibition graphics and supporting materials for projects across Saint Petersburg and the Leningrad Region</li>\n        <li>Designed interactive materials for exhibitions and events</li>\n        <li>Reviewed print proofs and production test prints before final output</li>\n      </ul>\n    </div>\n'''

          if 'Laika Design Studio' in s:
              print('Laika experience already exists; no change needed.')
          elif marker in s:
              s = s.replace(marker, laika + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('Could not find Freelance experience insertion point')
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name 'chatgpt[bot]'
          git config user.email 'chatgpt[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Laika design studio experience'
          git push
