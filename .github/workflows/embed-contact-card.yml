name: Embed contact card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/embed-contact-card.yml"

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Embed card image directly into HTML
        shell: python
        run: |
          from pathlib import Path
          import base64, re

          asset = Path('assets/contact-card.webp')
          data = asset.read_bytes()
          if not (data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
              raise SystemExit('contact-card.webp is not a valid WebP file')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          uri = 'data:image/webp;base64,' + base64.b64encode(data).decode('ascii')

          pattern = r'(<a class="telegram-card-link"[^>]*>\s*<img\s+src=")[^"]+("[^>]*>)'
          html, count = re.subn(pattern, lambda m: m.group(1) + uri + m.group(2), html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate Telegram card image tag')

          html_path.write_text(html, encoding='utf-8')

          for p in [Path('assets/contact-card.png'), Path('assets/contact-card2.png')]:
              if p.exists():
                  p.unlink()

      - name: Commit embedded image
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add -A index.html assets
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Embed Telegram contact card image"
          git push
