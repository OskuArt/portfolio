name: Behance deletion-aware sync patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-behance-deletion-sync.yml"

permissions:
  contents: write

jobs:
  patch-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Patch deletion-aware sync
        run: python scripts/patch_behance_deletions.py

      - name: Run Behance sync now
        run: python scripts/update_behance.py

      - name: Commit updater and synced portfolio
        shell: bash
        run: |
          git config user.name "behance-sync[bot]"
          git config user.email "behance-sync[bot]@users.noreply.github.com"
          rm .github/workflows/temp-behance-deletion-sync.yml
          rm scripts/patch_behance_deletions.py
          git add scripts/update_behance.py projects.json assets/project-previews .behance-sync-state.json .github/workflows/temp-behance-deletion-sync.yml scripts/patch_behance_deletions.py
          git commit -m "Make Behance sync remove deleted projects"
          git push
