name: Optimize card cursor performance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-card-cursor.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Optimize cursor and card rendering
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old_cursor_css = '''.cursor-glow,.cursor-dot{position:fixed;left:0;top:0;pointer-events:none;z-index:1000;border-radius:50%;opacity:0}\n.cursor-glow{width:36px;height:36px;background:rgba(242,138,91,.52);filter:blur(7px);mix-blend-mode:multiply;transform:translate(-50%,-50%);transition:width .18s,height .18s,opacity .2s,filter .18s}\n.cursor-dot{width:5px;height:5px;background:var(--accent);transform:translate(-50%,-50%);transition:width .18s,height .18s,opacity .2s}'''
          new_cursor_css = '''.cursor-glow,.cursor-dot{position:fixed;left:0;top:0;pointer-events:none;z-index:1000;border-radius:50%;opacity:0;will-change:transform}\n.cursor-glow{width:36px;height:36px;background:rgba(242,138,91,.52);filter:blur(7px);mix-blend-mode:multiply;transform:translate3d(-100px,-100px,0) translate(-50%,-50%);transition:width .18s,height .18s,opacity .2s,filter .18s;contain:layout paint style}\n.cursor-dot{width:5px;height:5px;background:var(--accent);transform:translate3d(-100px,-100px,0) translate(-50%,-50%);transition:width .18s,height .18s,opacity .2s}\nbody.cursor-over-card .cursor-glow{mix-blend-mode:normal;filter:blur(8px)}'''
          if old_cursor_css not in s:
              raise SystemExit("Cursor CSS block not found")
          s = s.replace(old_cursor_css, new_cursor_css, 1)

          old_link = '''.telegram-card-link{\n  position:relative;z-index:2;display:block;width:min(100%,760px);margin:0;\n  transform:rotate(-2.2deg);transform-origin:center;\n  transition:transform .38s cubic-bezier(.2,.8,.2,1),filter .38s;will-change:transform;\n}\n.telegram-card-link img{\n  display:block;width:100%;height:auto;border-radius:30px;\n  filter:drop-shadow(0 26px 26px rgba(17,18,15,.18)) drop-shadow(0 7px 8px rgba(17,18,15,.09));\n}\n.telegram-card-link:hover{transform:translateY(-7px) rotate(-.8deg) scale(1.035)}\n.telegram-card-link:hover img{filter:drop-shadow(0 34px 34px rgba(17,18,15,.22)) drop-shadow(0 10px 10px rgba(17,18,15,.11))}'''
          new_link = '''.telegram-card-link{\n  position:relative;z-index:2;display:block;width:min(100%,760px);margin:0;\n  transform:translate3d(0,0,0) rotate(-2.2deg);transform-origin:center;\n  transition:transform .38s cubic-bezier(.2,.8,.2,1),box-shadow .38s;will-change:transform;\n  border-radius:30px;\n  box-shadow:0 26px 26px rgba(17,18,15,.18),0 7px 8px rgba(17,18,15,.09);\n}\n.telegram-card-link img{\n  display:block;width:100%;height:auto;border-radius:30px;\n  filter:none;transform:translateZ(0);\n}\n.telegram-card-link:hover{\n  transform:translate3d(0,-7px,0) rotate(-.8deg) scale(1.035);\n  box-shadow:0 34px 34px rgba(17,18,15,.22),0 10px 10px rgba(17,18,15,.11);\n}\n.telegram-card-link:hover img{filter:none}'''
          if old_link not in s:
              raise SystemExit("Final Telegram card CSS block not found")
          s = s.replace(old_link, new_link, 1)

          old_mouse = '''  document.addEventListener('mousemove',e=>{\n    tx=e.clientX; ty=e.clientY;\n    dot.style.left=tx+'px'; dot.style.top=ty+'px';\n    document.body.classList.add('cursor-ready');\n  });\n  function animateCursor(){\n    gx+=(tx-gx)*.18; gy+=(ty-gy)*.18;\n    glow.style.left=gx+'px'; glow.style.top=gy+'px';\n    requestAnimationFrame(animateCursor);\n  }'''
          new_mouse = '''  document.addEventListener('mousemove',e=>{\n    tx=e.clientX; ty=e.clientY;\n    dot.style.transform=`translate3d(${tx}px,${ty}px,0) translate(-50%,-50%)`;\n    document.body.classList.add('cursor-ready');\n  }, {passive:true});\n  function animateCursor(){\n    gx+=(tx-gx)*.18; gy+=(ty-gy)*.18;\n    glow.style.transform=`translate3d(${gx}px,${gy}px,0) translate(-50%,-50%)`;\n    requestAnimationFrame(animateCursor);\n  }'''
          if old_mouse not in s:
              raise SystemExit("Cursor JS movement block not found")
          s = s.replace(old_mouse, new_mouse, 1)

          old_hover = '''  document.querySelectorAll('a,button').forEach(el=>{\n    el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hover'));\n    el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hover'));\n  });'''
          new_hover = '''  document.querySelectorAll('a,button').forEach(el=>{\n    el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hover'));\n    el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hover'));\n  });\n  const telegramCard=document.querySelector('.telegram-card-link');\n  if(telegramCard){\n    telegramCard.addEventListener('mouseenter',()=>document.body.classList.add('cursor-over-card'));\n    telegramCard.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-over-card'));\n  }'''
          if old_hover not in s:
              raise SystemExit("Cursor hover binding block not found")
          s = s.replace(old_hover, new_hover, 1)

          p.write_text(s, encoding="utf-8")

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          rm .github/workflows/optimize-card-cursor.yml
          git add index.html .github/workflows/optimize-card-cursor.yml
          git commit -m "Optimize contact card cursor performance"
          git push
