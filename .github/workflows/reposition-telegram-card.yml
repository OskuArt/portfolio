name: Reposition Telegram card
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reposition-telegram-card.yml']
permissions:
  contents: write
jobs:
  reposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update layout
        run: echo '' | base64 -d > /tmp/fix.py && python /tmp/fix.py
      - name: Commit
        run: git config user.name 'chatgpt[bot]' && git config user.email 'chatgpt[bot]@users.noreply.github.com' && git add index.html && git commit -m 'Move Telegram card below hero and fix image' && git push
