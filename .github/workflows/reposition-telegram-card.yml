name: Reposition Telegram card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reposition-telegram-card.yml"

permissions:
  contents: write

jobs:
  reposition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move Telegram card below hero
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Remove the card from inside the right hero column.
          html, count = re.subn(
              r'\n\s*<div class="telegram-card-stage">.*?</a>\s*</div>\s*(?=<div class="meta">)',
              '\n',
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not locate the existing Telegram card block')

          # Put it after the complete hero, so the original two-column hero keeps its layout.
          block = '''

  <div class="telegram-card-stage">
    <div class="telegram-card-callout">Click to<br><strong>text me!</strong>
      <svg class="telegram-card-arrow" viewBox="0 0 170 115" aria-hidden="true">
        <path d="M8 14 C48 18 74 78 144 76"/>
        <path d="M126 59 L146 76 L126 94"/>
      </svg>
    </div>
    <a class="telegram-card-link" href="https://t.me/oskuarttt" target="_blank" rel="noreferrer" aria-label="Message me on Telegram">
      <img src="https://raw.githubusercontent.com/OskuArt/portfolio/main/assets/contact-card.webp?v=20260901" alt="Kseniia Smirnova / Osku Halla graphic designer card">
    </a>
  </div>
'''

          marker = '  </div>\n\n  <div class="ticker"><div>'
          if marker not in html:
              raise SystemExit('Could not find end of hero')
          html = html.replace(marker, '  </div>' + block + '\n  <div class="ticker"><div>', 1)

          # Add a final CSS override. This intentionally only affects the contact card.
          css = r'''

/* Telegram card: below the main hero */
.telegram-card-stage{
  position:relative;
  display:grid;
  grid-template-columns:minmax(220px,.55fr) minmax(0,1.45fr);
  align-items:center;
  gap:clamp(28px,5vw,80px);
  width:min(1180px,94%);
  margin:18px auto 72px;
  padding:22px 42px 30px;
  isolation:isolate;
}
.telegram-card-callout{
  position:relative;
  left:auto;
  top:auto;
  align-self:center;
  font:500 clamp(34px,4vw,58px)/.88 "Space Grotesk",sans-serif;
  letter-spacing:-.065em;
  transform:rotate(-4deg);
  color:var(--ink);
  z-index:4;
}
.telegram-card-callout strong{color:var(--accent);font-weight:500}
.telegram-card-arrow{
  position:absolute;
  left:58%;
  top:74%;
  width:clamp(120px,12vw,170px);
  height:auto;
  overflow:visible;
}
.telegram-card-link{
  position:relative;
  z-index:2;
  display:block;
  width:min(100%,760px);
  margin:0;
  transform:rotate(-2.2deg);
  transform-origin:center;
  transition:transform .38s cubic-bezier(.2,.8,.2,1),filter .38s;
  will-change:transform;
}
.telegram-card-link img{
  display:block;
  width:100%;
  height:auto;
  border-radius:30px;
  filter:drop-shadow(0 26px 26px rgba(17,18,15,.18)) drop-shadow(0 7px 8px rgba(17,18,15,.09));
}
.telegram-card-link:hover{transform:translateY(-7px) rotate(-.8deg) scale(1.035)}
.telegram-card-link:hover img{filter:drop-shadow(0 34px 34px rgba(17,18,15,.22)) drop-shadow(0 10px 10px rgba(17,18,15,.11))}
@media(max-width:900px){
  .telegram-card-stage{grid-template-columns:1fr;width:min(760px,96%);gap:28px;margin:6px auto 58px;padding:12px 14px 24px}
  .telegram-card-callout{width:max-content;max-width:80%;font-size:40px;transform:rotate(-3deg)}
  .telegram-card-arrow{left:64%;top:70%;width:120px}
  .telegram-card-link{width:92%;margin:0 auto;transform:rotate(-1.7deg)}
}
@media(max-width:620px){
  .telegram-card-stage{margin-top:0;margin-bottom:44px;padding-top:2px}
  .telegram-card-callout{font-size:30px;max-width:88%}
  .telegram-card-arrow{left:60%;top:72%;width:92px}
  .telegram-card-link{width:96%}
}
'''
          html = html.replace('</style>', css + '\n</style>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit layout fix
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move Telegram card below hero and fix image" || exit 0
          git push
