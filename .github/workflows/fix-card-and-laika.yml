name: Fix contact card and Laika date

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-card-and-laika.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(<a class="telegram-card-link"[\s\S]*?<img\s+src=")[^"]+("[^>]*alt="Kseniia Smirnova / Osku Halla graphic designer card"[^>]*>)',
              re.I,
          )
          s, n = pattern.subn(r'\1contact-card-cropped.png\2', s, count=1)
          if n != 1:
              raise SystemExit("Could not replace Telegram card image source")

          s, n = re.subn(
              r'\.telegram-card-link img\{[\s\S]*?\n\}',
              '''.telegram-card-link img{
            display:block;
            width:100%;
            height:auto;
            object-fit:contain;
            border-radius:0;
            background:transparent;
            filter:drop-shadow(0 24px 24px rgba(17,18,15,.18)) drop-shadow(0 6px 7px rgba(17,18,15,.10));
            transition:filter .38s cubic-bezier(.2,.8,.2,1);
          }''',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit("Could not replace card image CSS")

          s, n = re.subn(
              r'\.telegram-card-link:after\{[\s\S]*?\n\}',
              '.telegram-card-link:after{display:none}',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit("Could not remove card gloss overlay")

          old = '<div class="company">Laika Design Studio</div><div class="date">2021 — 2022</div>'
          new = '<div class="company">Laika Design Studio</div><div class="date">2022</div>'
          if old not in s:
              raise SystemExit("Could not find Laika date")
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          rm .github/workflows/fix-card-and-laika.yml
          git add index.html .github/workflows/fix-card-and-laika.yml
          git commit -m "Use uploaded contact card and fix Laika date"
          git push
