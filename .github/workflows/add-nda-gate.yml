name: Add NDA access gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-nda-gate.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add password gate
        run: python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')) )"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add NDA portfolio access gate"
          git push
