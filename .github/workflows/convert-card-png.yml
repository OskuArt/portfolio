name: Install Telegram card PNG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/convert-card-png.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PNG from uploaded chunks
        shell: bash
        run: |
          cat assets/.card-png-0.b64 assets/.card-png-1.b64 assets/.card-png-2.b64 assets/.card-png-3.b64 assets/.card-png-4.b64 assets/.card-png-5.b64 > /tmp/contact-card.b64
          base64 --decode /tmp/contact-card.b64 > assets/contact-card.png
          python - <<'PY'
          from pathlib import Path
          import re

          png = Path('assets/contact-card.png').read_bytes()
          if not png.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Generated contact-card.png is not a valid PNG')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, count = re.subn(
              r'(class="telegram-card-link"[^>]*>[\s\S]*?<img\s+src=")[^"]+("[^>]*>)',
              r'\1assets/contact-card.png?v=20260902-final\2',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not find Telegram card image in index.html')
          p.write_text(s, encoding='utf-8')
          print('PNG bytes:', len(png))
          PY

      - name: Commit PNG version
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html assets/contact-card.png
          git commit -m "Use PNG Telegram contact card"
          git push
