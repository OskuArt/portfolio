name: Convert Telegram card to PNG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/convert-card-png.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert contact card to PNG and patch HTML
        shell: bash
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          src = Path("assets/contact-card.webp")
          dst = Path("assets/contact-card.png")

          with Image.open(src) as im:
              im = im.convert("RGBA")
              im.save(dst, "PNG", optimize=True)

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'https://raw\.githubusercontent\.com/OskuArt/portfolio/main/assets/contact-card\.webp(?:\?[^"\']*)?',
              'assets/contact-card.png?v=20260902-1',
              s,
          )
          s = re.sub(
              r'assets/contact-card\.webp(?:\?[^"\']*)?',
              'assets/contact-card.png?v=20260902-1',
              s,
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit PNG version
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html assets/contact-card.png
          git commit -m "Use PNG Telegram contact card"
          git push
