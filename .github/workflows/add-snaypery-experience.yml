name: Add Snaypery experience

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-snaypery-experience.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add experience row
        shell: bash
        run: |
          python3 -c "import base64,pathlib; p=pathlib.Path('index.html'); s=p.read_text(encoding='utf-8'); m=base64.b64decode('ICAgIDxkaXYgY2xhc3M9InJvdyI+CiAgICAgIDxkaXY+PGRpdiBjbGFzcz0icm9sZSI+RmlndXJlIFNrYXRpbmcgQ29hY2g8L2Rpdj48ZGl2IGNsYXNzPSJjb21wYW55Ij5GcmVlbGFuY2U8L2Rpdj48ZGl2IGNsYXNzPSJkYXRlIj5KYW51YXJ5IDIwMjEg4oCUIFByZXNlbnQ8L2Rpdj48L2Rpdj4=').decode(); b=base64.b64decode('').decode(); assert 'Рекламные Снайперы' not in s; assert m in s; p.write_text(s.replace(m,b+m,1),encoding='utf-8')"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Advertising Snipers experience"
          git push
