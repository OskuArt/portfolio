name: Tighten contact card frame

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tighten-card-frame.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tighten visual frame around Telegram card
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='</style>'; css='\n/* Telegram card frame refinement */\n.telegram-card-link{overflow:hidden!important;border-radius:24px!important;background:#fffefd!important;box-shadow:0 18px 30px rgba(17,18,15,.12),0 4px 10px rgba(17,18,15,.06)!important;}\n.telegram-card-link img{transform:translateZ(0) scale(1.11)!important;transform-origin:center!important;border-radius:20px!important;}\n.telegram-card-link:hover{box-shadow:0 24px 34px rgba(17,18,15,.15),0 6px 12px rgba(17,18,15,.07)!important;}\n'; assert marker in s; s=s if '/* Telegram card frame refinement */' in s else s.replace(marker,css+'\n'+marker,1); p.write_text(s,encoding='utf-8')"

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          rm .github/workflows/tighten-card-frame.yml
          git add index.html .github/workflows/tighten-card-frame.yml
          git commit -m "Refine contact card frame"
          git push
