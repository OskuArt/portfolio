name: Redesign private portfolio cards

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/private-portfolio-cards.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply private portfolio patch
        run: python3 scripts/patch_private_portfolio.py

      - name: Commit changes
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          rm .github/workflows/private-portfolio-cards.yml
          rm scripts/patch_private_portfolio.py
          git add index.html .github/workflows/private-portfolio-cards.yml scripts/patch_private_portfolio.py
          git commit -m "Redesign private portfolio cards"
          git push
