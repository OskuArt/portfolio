name: Fix Laika year

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-laika-2023.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Laika year
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '<div class="company">Laika Design Studio</div><div class="date">2022</div>'
          new = '<div class="company">Laika Design Studio</div><div class="date">2023</div>'
          if old not in s:
              raise SystemExit("Could not find Laika 2022 date")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          rm .github/workflows/fix-laika-2023.yml
          git add index.html .github/workflows/fix-laika-2023.yml
          git commit -m "Fix Laika year to 2023"
          git push
