name: Mobile-only layout refinement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-only-layout.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply mobile-only CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
          /* Mobile-only composition refinement. Desktop intentionally untouched. */
          @media(max-width:620px){
            .telegram-card-stage{
              display:block!important;
              width:100%!important;
              max-width:none!important;
              margin:6px auto 48px!important;
              padding:8px 8px 18px!important;
              overflow:visible!important;
            }
            .telegram-card-callout{
              position:relative!important;
              left:8px!important;
              top:auto!important;
              width:62%!important;
              max-width:250px!important;
              margin:0 0 8px!important;
              font-size:31px!important;
              line-height:.88!important;
              transform:rotate(-3deg)!important;
              z-index:4!important;
            }
            .telegram-card-arrow{
              position:absolute!important;
              left:auto!important;
              right:25%!important;
              top:92px!important;
              width:96px!important;
              height:auto!important;
              transform:rotate(8deg)!important;
              z-index:5!important;
              overflow:visible!important;
            }
            .telegram-card-link{
              width:78%!important;
              margin:28px 3% 0 auto!important;
              border-radius:28px!important;
              overflow:hidden!important;
              transform:none!important;
              box-shadow:0 14px 24px rgba(17,18,15,.12),0 4px 8px rgba(17,18,15,.06)!important;
              transition:none!important;
            }
            .telegram-card-link img{
              display:block!important;
              width:100%!important;
              height:auto!important;
              border-radius:26px!important;
              transform:none!important;
              filter:none!important;
            }
            .telegram-card-link:hover{transform:none!important}
            .private{grid-template-columns:1fr!important;gap:14px!important}
            .pc{
              min-height:252px!important;
              padding:22px 18px 86px!important;
              border-radius:26px!important;
              overflow:hidden!important;
              transform:none!important;
            }
            .pc:hover{transform:none!important}
            .pc__content,.pc--smeshariki .pc__content{max-width:100%!important}
            .pc small{margin-bottom:30px!important;font-size:9px!important}
            .pc h3{font-size:34px!important;line-height:.94!important;margin-bottom:10px!important}
            .pc p{font-size:12px!important;line-height:1.45!important;max-width:100%!important}
            .pc b{right:16px!important;bottom:16px!important;width:48px!important;height:48px!important}
            .pc--caseplace .pc__logo{
              left:18px!important;
              right:auto!important;
              top:auto!important;
              bottom:22px!important;
              width:160px!important;
              max-width:44%!important;
              opacity:.42!important;
              transform:none!important;
              transition:none!important;
            }
            .pc--caseplace:hover .pc__logo{transform:none!important}
            .pc--smeshariki .pc__art{
              right:28px!important;
              bottom:-24px!important;
              width:118px!important;
              max-width:none!important;
              opacity:.96!important;
              transform:none!important;
              transition:none!important;
              filter:drop-shadow(0 7px 10px rgba(17,18,15,.08))!important;
            }
            .pc--smeshariki:hover .pc__art{transform:none!important}
          }
          '''
          marker = '</style>'
          if marker not in s:
              raise SystemExit('Closing style tag not found')
          s = s.replace(marker, css + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine mobile-only layout"
          git push
