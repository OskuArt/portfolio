name: Refine private portfolio cards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-private-cards.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refine cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<small>Частный портфель · 01</small>': '<small>Private portfolio · 01</small>',
              '<small>Частный портфель · 02</small>': '<small>Private portfolio · 02</small>',
              '<h3>СМЕШАРИКИ × Case Place</h3>': '<h3>SMESHARIKI × Case Place</h3>',
              '<p>Коммерческие работы и успехи с моего прошлого места работы (метрики, e-comm, реклама - все сюда!)</p>': '<p>Commercial work and achievements from my previous in-house role: metrics, e-commerce, advertising and more.</p>',
              '<p>Лицензионный проект, проведенный под моим чутким контролем и выполненный моими золотыми руками</p>': '<p>A licensed project developed under my close supervision and brought to life by my own hands.</p>',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)
          css = """
          /* Private portfolio compact horizontal refinement */
          .private{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:16px!important;margin-top:14px!important;align-items:stretch}
          .pc{min-height:218px!important;padding:24px!important;border-radius:24px!important}
          .pc__content{max-width:59%!important}
          .pc small{margin-bottom:38px!important;font-size:9px!important}
          .pc h3{font-size:clamp(32px,3.15vw,48px)!important;line-height:.92!important;margin-bottom:10px!important}
          .pc p{font-size:11px!important;line-height:1.42!important;max-width:430px!important}
          .pc b{right:18px!important;bottom:18px!important;width:46px!important;height:46px!important;font-size:17px!important}
          .pc--caseplace{overflow:hidden!important}
          .pc--caseplace .pc__logo{right:5.5%!important;top:50%!important;width:min(40%,310px)!important;transform:translateY(-50%) scale(1)!important;transform-origin:center!important;transition:transform .38s cubic-bezier(.2,.8,.2,1)!important;will-change:transform}
          .pc--caseplace:hover .pc__logo{transform:translateY(-50%) scale(1.07)!important}
          .pc--smeshariki{overflow:visible!important;z-index:2}
          .pc--smeshariki .pc__content{max-width:61%!important}
          .pc--smeshariki .pc__art{right:7%!important;bottom:0!important;width:min(30%,210px)!important;transform:translate3d(0,0,0) rotate(0deg)!important;transform-origin:58% 88%!important;transition:transform .42s cubic-bezier(.2,.8,.2,1)!important;filter:drop-shadow(0 10px 14px rgba(17,18,15,.09))!important;will-change:transform}
          .pc--smeshariki:hover .pc__art{transform:translate3d(0,-16px,0) rotate(-4deg)!important}
          @media(max-width:1000px){.pc{min-height:210px!important;padding:22px!important}.pc small{margin-bottom:30px!important}.pc h3{font-size:36px!important}.pc--caseplace .pc__logo{width:37%!important;right:5%!important}.pc--smeshariki .pc__art{width:min(29%,185px)!important;right:6%!important}}
          @media(max-width:720px){.private{grid-template-columns:1fr!important;gap:14px!important}.pc{min-height:220px!important}.pc__content,.pc--smeshariki .pc__content{max-width:64%!important}.pc--caseplace .pc__logo{width:min(38%,250px)!important;opacity:.95!important;right:7%!important;top:50%!important;bottom:auto!important;transform:translateY(-50%) scale(1)!important}.pc--caseplace:hover .pc__logo{transform:translateY(-50%) scale(1.06)!important}.pc--smeshariki .pc__art{width:min(27%,180px)!important;right:7%!important;bottom:0!important;opacity:1!important}}
          @media(max-width:520px){.pc{min-height:230px!important;padding:20px 18px 62px!important}.pc__content,.pc--smeshariki .pc__content{max-width:100%!important}.pc h3{font-size:32px!important}.pc--caseplace .pc__logo{width:42%!important;right:70px!important;top:auto!important;bottom:20px!important;transform:none!important;opacity:.30!important}.pc--caseplace:hover .pc__logo{transform:scale(1.05)!important}.pc--smeshariki .pc__art{width:145px!important;right:10px!important;bottom:0!important;opacity:.88!important}}
          """
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "chatgpt[bot]"
          git config user.email "chatgpt[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine private portfolio cards"
          git push
